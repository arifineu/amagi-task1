<html>
    <body>
        <div id="app"></div>

        <script>
            const patients = [
                { id: "P101", name: "Santos, Maria", status: "Active", balance: 1500.00, ward: "A" },
                { id: "P102", name: "Reyes, Jose", status: "Discharged", balance: 0.00, ward: "B" },
                { id: "P103", name: "Cruz, Ana", status: "Active", balance: 0.00, ward: "A" },
                { id: "P104", name: "Bautista, Luis", status: "Active", balance: 5200.50, ward: "C" },
                { id: "P105", name: "Garcia, Elena", status: "Discharged", balance: 300.00, ward: "B" }
            ]

            const app = document.getElementById('app')
            const rows = []
            let hideDischarged = false

            const button = document.createElement('button')
            button.style.marginBottom = ("1rem")
            button.style.padding = ("8px")
            button.textContent = "Hide Discharged"
            button.addEventListener('click', toggleBtn)
            app.appendChild(button)

            for (let i = 0; i < patients.length; i++) {
                const patient = patients[i]
                const child = document.createElement('div')
                
                child.textContent = "ID: " + patient.id + "; Name: " + patient.name + "; Status: " + patient.status + "; Balance: " + patient.balance + "; Ward: " + patient.ward
                child.dataset.status = patient.status
                child.style.marginTop = ("8px")
                child.style.padding = ("8px")
                
                if (patient.status === "Discharged") child.style.backgroundColor = "#E0E0E0"
                if (patient.balance > 0 && patient.status === "Active") child.style.border = "2px solid red"

                rows.push(child)
                app.appendChild(child)
            }

            function toggleBtn() {
                hideDischarged = !hideDischarged
                button.textContent = hideDischarged ? "Show All" : "Hide Discharged"

                for (let i = 0; i< rows.length; i++) {
                    if (hideDischarged && rows[i].dataset.status === "Discharged") rows[i].remove()
                    else app.appendChild(rows[i])
                }
            }
        </script>
    </body>
</html>
